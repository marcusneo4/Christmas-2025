<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soon Family Christmas Lucky Draw 2025</title>
  <meta name="theme-color" content="#060912">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0-5 5m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m0 0-5-5m5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.5 2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="m17 9 5 6m0-6-5 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3 20c.6-3.4 3-5.4 6-5.4s5.4 2 6 5.4M16 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c1.7.7 2.7 2.5 3 5.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></g></symbol>
    <symbol id="i-redraw" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5Z" fill="currentColor"/></symbol>
  </svg>

  <div class="stage" id="stage">
    <canvas class="bokeh" id="bokeh" aria-hidden="true"></canvas>
    <header class="topbar">
      <div class="badge" id="badge"><i></i><span id="badge-text">Pre-show</span></div>
      <h1 class="show-title">Soon Family <span>Christmas Lucky Draw</span> 2025</h1>
      <div class="topbar-right">
        <span class="counter" id="counter"></span>
        <button class="icon-btn speed-btn" id="speed-btn" type="button" title="Speed (keys 1–4): ×1, ×1.5, ×2, ×3"><span id="speed-text">×1</span></button>
        <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Sound on (M)" title="Sound (M)">
          <svg><use href="#i-sound"/></svg>
        </button>
      </div>
    </header>

    <!-- SETUP -->
    <section class="screen" id="setup" aria-label="Setup">
      <div class="setup-grid">
        <div class="panel contestants">
          <div class="panel-head">
            <h2>On the tree</h2>
            <output class="big-count" id="name-count" for="names">0</output>
          </div>
          <label class="sr-only" for="names">Contestant names, one per line</label>
          <textarea id="names" spellcheck="false" autocomplete="off" placeholder="One name per line"></textarea>
          <div class="panel-foot">
            <button class="btn ghost" id="upload-btn" type="button"><svg><use href="#i-upload"/></svg>Upload CSV or TXT</button>
            <input type="file" id="upload" accept=".csv,.txt,text/plain,text/csv" hidden>
            <span class="file-name" id="file-name"></span>
            <button class="btn link" id="reset-names" type="button"><svg><use href="#i-reset"/></svg>Restore family list</button>
          </div>
          <p class="notice" id="dupes" hidden></p>
        </div>

        <div class="panel prizes">
          <div class="panel-head">
            <h2>Prizes</h2>
            <span class="panel-meta" id="prize-meta"></span>
            <div class="seg" role="tablist" aria-label="Prize editor view">
              <button type="button" role="tab" id="view-list" aria-selected="true">List</button>
              <button type="button" role="tab" id="view-paste" aria-selected="false">Paste</button>
            </div>
          </div>
          <ol class="prize-edit" id="prize-edit" aria-label="Prizes in rank order, 1st prize first"></ol>
          <label class="sr-only" for="prize-text">Prizes, one per line, 1st prize first</label>
          <textarea id="prize-text" class="prize-text" spellcheck="false" hidden placeholder="One prize per line. The first line is the 1st prize, the second line the 2nd prize, and so on."></textarea>
          <div class="panel-foot">
            <button class="btn ghost" id="add-prize" type="button"><svg><use href="#i-plus"/></svg>Add prize</button>
            <button class="btn link" id="reset-prizes" type="button"><svg><use href="#i-reset"/></svg>Restore defaults</button>
          </div>
          <div class="show-row">
            <div class="stepper" aria-label="Prizes that get the full show">
              <span>Full show for the top</span>
              <button type="button" id="full-minus" aria-label="Fewer full shows">−</button>
              <output id="full-count">5</output>
              <button type="button" id="full-plus" aria-label="More full shows">+</button>
            </div>
            <div class="seg" role="radiogroup" aria-label="The other prizes">
              <span>The rest</span>
              <button type="button" role="radio" id="rest-quick" aria-checked="true" title="Each prize gets its own short show">Quick</button>
              <button type="button" role="radio" id="rest-batch3" aria-checked="false" title="Three prizes drawn in one round">3 at once</button>
              <button type="button" role="radio" id="rest-batch5" aria-checked="false" title="Five prizes drawn in one round">5 at once</button>
            </div>
          </div>
        </div>
      </div>

      <div class="resume" id="resume" hidden>
        <svg class="resume-star"><use href="#i-star"/></svg>
        <p><b>Draw in progress.</b> <span id="resume-text"></span></p>
        <button class="btn primary" id="resume-btn" type="button">Resume draw</button>
        <button class="btn ghost" id="discard-btn" type="button">Discard</button>
      </div>

      <div class="setup-actions">
        <button class="btn primary xl" id="go-live" type="button"><svg><use href="#i-star"/></svg>Start the lucky draw</button>
        <button class="btn secondary xl" id="go-players" type="button"><svg><use href="#i-users"/></svg>Pick game players</button>
        <div class="go-row">
          <p class="go-hint" id="go-hint"></p>
          <div class="rehearse">
            <span>Rehearsal</span>
            <button class="btn link" id="rehearse-mine" type="button"><svg><use href="#i-play"/></svg>With my list</button>
            <button class="btn link" id="rehearse-test" type="button"><svg><use href="#i-play"/></svg>With 150 test names</button>
          </div>
        </div>
      </div>
    </section>

    <!-- DRAW: Last Light Standing -->
    <section class="screen" id="draw" aria-label="Lucky draw">
      <aside class="prize-panel" id="prize-panel">
        <p class="prize-label" id="prize-label"></p>
        <h2 class="prize-name" id="prize-name"></h2>
        <div class="status" aria-live="off">
          <span class="status-num" id="status-num"></span>
          <span class="status-text" id="status-text"></span>
        </div>
        <p class="cue" id="cue"></p>
        <div class="redraw" id="redraw" hidden>
          <button class="btn ghost" id="redraw-btn" type="button"><svg><use href="#i-redraw"/></svg>Not here? Redraw</button>
          <div class="redraw-pick" id="redraw-pick" hidden></div>
        </div>
        <h3 class="recent-head" id="recent-head" hidden>Already won</h3>
        <ol class="recent" id="recent"></ol>
        <p class="progress" id="progress"></p>
      </aside>

      <div class="tree-wrap" id="tree-wrap">
        <div class="room" aria-hidden="true"></div>
        <div class="camera" id="camera">
          <canvas class="tree-canvas" id="tree-canvas" aria-hidden="true"></canvas>
          <div class="tree-shade" aria-hidden="true"></div>
        </div>
        <canvas class="lights-canvas" id="lights-canvas" aria-hidden="true"></canvas>
        <div class="camera" id="camera-top">
          <div class="labels" id="labels" aria-hidden="true"></div>
          <div class="star" id="star" aria-hidden="true">
            <div class="rays"></div>
            <svg viewBox="0 0 24 24"><use href="#i-star"/></svg>
          </div>
        </div>
        <div class="closeup" id="closeup" aria-hidden="true"><span>Still glowing</span><b></b></div>
        <div class="beam" id="beam" aria-hidden="true"></div>
        <div class="finals" id="finals"></div>
        <div class="flash" id="flash" aria-hidden="true"></div>
        <div class="winner-plate" id="winner-plate">
          <span class="wp-label"></span>
          <b class="wp-name"></b>
          <span class="wp-prize"></span>
          <ol class="wp-list"></ol>
        </div>
      </div>
      <canvas class="snow" id="snow" aria-hidden="true"></canvas>

      <footer class="keys">
        <span><kbd>Space</kbd>Go</span>
        <span id="skip-key"><kbd>S</kbd>Skip all</span>
        <span id="redraw-key"><kbd>R</kbd>Redraw</span>
        <span id="speed-key"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd>Speed <b id="speed-label">×1</b></span>
        <span><kbd>Esc</kbd>Setup</span>
        <span><kbd>M</kbd>Sound</span>
      </footer>
    </section>

    <!-- RESULTS -->
    <section class="screen" id="results" aria-label="Results">
      <div class="results-head">
        <h2 class="results-title">Tonight's winners</h2>
        <div class="grand-card" id="grand"></div>
      </div>
      <ol class="results-board" id="results-board"></ol>
      <div class="results-actions">
        <button class="btn primary" id="download-btn" type="button"><svg><use href="#i-download"/></svg>Download results</button>
        <button class="btn secondary" id="results-players" type="button"><svg><use href="#i-users"/></svg>Pick game players</button>
        <button class="btn ghost" id="new-draw" type="button"><svg><use href="#i-reset"/></svg>New draw</button>
      </div>
    </section>
    <div class="blackout" id="blackout" aria-hidden="true"></div>
    <div class="ember" id="ember" aria-hidden="true"></div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="sr-only" id="announcer" aria-live="assertive"></div>

  <script src="vendor/gsap.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/glass.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
